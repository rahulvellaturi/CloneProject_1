# Free CI on GitHub Actions (public repos: unlimited minutes)
name: CI

on:
  push:
    branches: [main, develop, "cursor/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & test
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-fund --no-audit
      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests
      - name: Production build
        working-directory: frontend
        env:
          CI: false
          REACT_APP_API_URL: https://example.com/api
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/facebook-clone-backend:latest
            ghcr.io/${{ github.repository_owner }}/facebook-clone-backend:${{ github.sha }}
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_API_URL=${{ vars.REACT_APP_API_URL || 'http://localhost:8080/api' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/facebook-clone-frontend:latest
            ghcr.io/${{ github.repository_owner }}/facebook-clone-frontend:${{ github.sha }}
