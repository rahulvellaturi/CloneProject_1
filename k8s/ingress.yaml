# Requires an Ingress controller (e.g. nginx-ingress on minikube, or cloud LB)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: facebook-clone-ingress
  namespace: facebook-clone
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: facebook-clone.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: facebook-clone-api
                port:
                  number: 8080
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: facebook-clone-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: facebook-clone-web
                port:
                  number: 80
