# Copy to secrets.yaml and fill values (do NOT commit secrets.yaml)
# kubectl apply -f k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: facebook-clone-secrets
  namespace: facebook-clone
type: Opaque
stringData:
  # Neon / Supabase / Render Postgres connection string host part:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://YOUR_HOST/neondb?sslmode=require"
  SPRING_DATASOURCE_USERNAME: "your_user"
  SPRING_DATASOURCE_PASSWORD: "your_password"
  JWT_SECRET: "replace-with-32-plus-character-secret"
