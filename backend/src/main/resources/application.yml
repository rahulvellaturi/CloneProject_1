spring:
  application:
    name: facebook-clone-backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/facebook_clone}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-minimum-32-characters}
  expiration: 86400000 # 24 hours

app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
