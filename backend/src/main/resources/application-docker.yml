spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/facebook_clone}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    show-sql: false

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost}
  upload-dir: ${APP_UPLOAD_DIR:./uploads}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
