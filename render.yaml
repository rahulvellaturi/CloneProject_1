# Render Blueprint — free tier friendly
# Docs: https://render.com/docs/blueprint-spec
# 1. Connect GitHub repo in Render Dashboard
# 2. Use Neon (neon.tech) for free PostgreSQL — paste connection into env vars below
# 3. Apply blueprint or create services manually from this file
# 4. PR previews: sync blueprint, then open a PR — Render posts preview URLs to GitHub

previews:
  generation: automatic

services:
  - type: web
    name: facebook-clone-api
    previews:
      generation: automatic
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ALLOWED_ORIGINS
        sync: false
      - key: APP_UPLOAD_DIR
        value: /app/uploads

  - type: web
    name: facebook-clone-web
    previews:
      generation: automatic
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: CI
        value: "false"
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
